# /etc/nginx/sites-available/athanor
# Reverse proxy for Athanor Alpha dashboard with HTTP basic auth.
#
# Setup:
#   1. Install: sudo apt install nginx apache2-utils
#   2. Create password file: sudo htpasswd -c /etc/nginx/.htpasswd athanor
#   3. Copy config: sudo cp deploy/nginx/athanor.conf /etc/nginx/sites-available/athanor
#   4. Enable: sudo ln -s /etc/nginx/sites-available/athanor /etc/nginx/sites-enabled/
#   5. Test: sudo nginx -t
#   6. Reload: sudo systemctl reload nginx
#
# For HTTPS (recommended): use certbot
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d yourdomain.com

server {
    listen 80;
    server_name _;   # replace with your domain or IP

    # Basic auth
    auth_basic           "Athanor Alpha";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    location / {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # WebSocket support (required for Streamlit)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    600;
        proxy_connect_timeout 600;
        proxy_send_timeout    600;

        # Streamlit static files
        proxy_buffering off;
    }

    # Health endpoint (no auth — for UptimeRobot)
    location /healthz {
        auth_basic off;
        proxy_pass http://127.0.0.1:8501/healthz;
        access_log off;
    }

    # Uptime ping (plain 200)
    location /ping {
        auth_basic off;
        return 200 "pong\n";
        add_header Content-Type text/plain;
        access_log off;
    }
}
